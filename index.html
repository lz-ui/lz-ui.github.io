<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lz-ui</title>
    <style>
        *{
            padding: 0;
            margin: 0;
        }
        html,body{
            width: 100%;
            height: 100%;
        }
        .box{
            width: 100%;
            height: 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        .box h3{
            color: #333;
            font-size: 16px;
            font-weight: normal;
        }
        .box a{
            display:block;
            padding: 15px 0;
            color:#333;
        }

    </style>
</head>
<body>
    <div class="box">
        <h3>
            Lz-ui 
        </h3>
    </div>
   
</body>
</html>
